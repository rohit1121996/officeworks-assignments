services:
  api:
    build: .
    command: npm run dev:server
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-catalogue@example.test}
      SALES_INBOX: ${SALES_INBOX:-sales@example.test}
    ports:
      - "3001:3001"
    depends_on:
      - mailpit
  web:
    build: .
    command: npm run dev:client
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:3001}
    ports:
      - "5174:5173"
    depends_on:
      - api
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
